name: AI documentation pipeline

# Single label-driven entry point for the three AI doc tasks. This file is only a router:
# it matches the label + actor, then delegates the actual work to a reusable workflow so each
# task's steps live in their own file.
#
#   ISSUE  + needs-draft (+ a context label) -> _ai-draft.yml   : draft the artifact, open a PR
#   PR     + needs-review                     -> _ai-review.yml  : fresh Opus review, route on verdict
#   PR     + needs-work                       -> _ai-fix.yml     : address remarks, hand back to review
#
# Labels
#   Action/state : needs-draft (issue), needs-review, needs-work, needs-approval (PR)
#   Context/type : uc | requirement | adr | specs | development | testing | workflow
#     `adr` is also load-bearing in the draft job's concurrency group expression below (keys
#     the shared ai-draft-adr group) — a rename there needs updating too, or the guard silently
#     degrades back to per-issue grouping with no error.
# A context label says WHAT to draft and gives the reviewer context; the action label is the
# go-signal. `development`/`testing` drafts must additionally pin an approved task via a
# `Plan: docs/plans/<file>.md#T<task-number>` line in the issue body — see _ai-draft.yml's header
# comment for the full containment story. `workflow` (CI/skill/agent changes) is deliberately
# never auto-drafted — only its review is wired (see _ai-review.yml / workflow-reviewer.md).
# Review picks its checklist from the changed file paths, not the label — this is also why a
# human-authored `development`/`testing` PR (touching custom_components/ or tests/) already gets
# reviewed by code-reviewer/test-reviewer today, independent of whether it came through the
# drafter above or was authored by hand.
# Run .github/setup-labels.sh once so every label exists (gh --add-label won't create them).
#
# Guards on every AI job: exact label + actor allow-list. Applying a label needs Triage+, so
# the label itself is the maintainer's approval; the `ai` environment (declared inside each
# reusable workflow) only scopes the API key. PAT-added labels count as the PAT owner. Merge
# always needs the maintainer's manual approval (CODEOWNERS + branch protection).
#
# pull_request (NOT pull_request_target): a fork PR runs with the workflow file version from
# its OWN head ref, but gets no repository secrets and a read-only default GITHUB_TOKEN — a
# platform guarantee, not something this file configures — so it can never spend
# ANTHROPIC_API_KEY or push/write regardless of what it changes. This holds for every path
# below, including .github/workflows/**: even a fork PR that rewrites the pipeline's own
# workflow files only ever runs that rewritten version with no secrets attached. `review` DOES
# hold pull-requests/issues: write and secrets: inherit on a same-repo PR (it spends the API key
# and posts comments), so it relies on that platform guarantee, not on lacking write access, to
# stay safe against a fork PR. `fix` additionally excludes forks outright
# (head.repo.full_name check) as belt-and-suspenders, since it also holds contents: write and
# can push. The path filter's job is only to scope which doc/CI trees the review step knows how
# to checklist — it is not itself a trust boundary.
#
# Permissions live on the calling jobs below (the token passed to a reusable workflow is
# governed by the caller). Concurrency keys also live here, where the event context is richest.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
    paths:
      - "docs/analysis/**"
      - "docs/adl/**"
      - "docs/plans/**"
      - "docs/reference/**"
      - "CLAUDE.md"
      - ".github/workflows/**"
      - ".claude/skills/**"
      - ".claude/agents/**"
      - ".github/setup-labels.sh"
      - ".github/ISSUE_TEMPLATE/**"
      - "custom_components/**"
      - "tests/**"

# Conservative default; each calling job widens to exactly what its reusable workflow needs.
permissions:
  contents: read

jobs:
  draft:
    if: >
      github.event_name == 'issues' &&
      github.event.label.name == 'needs-draft' &&
      contains(fromJSON('["kristofdegrave"]'), github.event.sender.login)
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      # ADR drafts additionally share one group across issues (not just per-issue), serializing
      # them: the "Resolve ADR branch" step in _ai-draft.yml picks the next ADR number from
      # what's merged on main, so two `adr` issues labeled minutes apart could otherwise both
      # pass its collision check before either pushes a branch. Every other context label keeps
      # the plain per-issue group.
      #
      # Known residual limit, accepted rather than engineered around (GitHub Actions keeps at
      # most one queued run per group with cancel-in-progress: false — a third `adr` issue
      # labeled `needs-draft` while two are already running/queued silently cancels the second
      # one's queued run, leaving that issue stuck on `needs-draft` with no comment). ADR issues
      # are filed rarely enough (one at a time, per write-adr) that three in flight
      # simultaneously is not expected in practice; the "Resolve ADR branch" step's own guard
      # still prevents a silent clobber if it ever happens.
      group: >-
        ${{ contains(github.event.issue.labels.*.name, 'adr') && 'ai-draft-adr' || format('ai-draft-{0}', github.event.issue.number) }}
      cancel-in-progress: false
    uses: ./.github/workflows/_ai-draft.yml
    secrets: inherit
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      issue_body: ${{ github.event.issue.body }}
      labels_json: ${{ toJSON(github.event.issue.labels.*.name) }}

  review:
    if: >
      github.event_name == 'pull_request' &&
      github.event.label.name == 'needs-review' &&
      contains(fromJSON('["kristofdegrave"]'), github.event.sender.login)
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # Must stay FALSE: this job is spawned by every labeled event on a doc PR (the `if` filters
    # to needs-review afterward), so with `true` the review's own routing (which adds needs-work)
    # would spawn a sibling run that cancels its parent mid-flight. Queued label-noise runs are
    # harmless — their job is skipped by the label guard.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/_ai-review.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  fix:
    if: >
      github.event_name == 'pull_request' &&
      github.event.label.name == 'needs-work' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["kristofdegrave"]'), github.event.sender.login)
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: ai-fix-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/_ai-fix.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_ref: ${{ github.event.pull_request.head.ref }}
