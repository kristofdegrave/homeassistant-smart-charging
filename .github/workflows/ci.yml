name: CI

# Build/validate + test gate for the integration code. Realizes the dev-tooling CI that
# ADR-0009 deferred (pytest for logic, HA harness for adapters/coordinator).
#
# lint/test/hassfest/hacs are required status checks in branch protection on main, so the
# workflow's `on:` trigger has no path filter -- a required check that never triggers at all
# (e.g. because the whole workflow was path-filtered out) leaves the PR stuck "pending"
# forever. Instead the workflow always runs; a `changes` job computes whether code-relevant
# paths changed, and each job skips internally via
# `if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')`
# on non-matching PRs -- reporting "skipped" (which satisfies a required check) instead of
# never running. The `needs.changes.result != 'success'` half is deliberate fail-safe: if the
# `changes` job itself errors, jobs still run rather than silently reporting green.
#
# `perf` is a deliberate exception to that pattern: it isn't a required status check, so it
# simply reports "skipped" on `pull_request` events instead (its `if:` excludes that event) --
# avoids sampling the perf suite on noisy per-PR shared-runner attempts, matching its
# baseline/trend model of one accepted data point per merge (issue #729). It still runs on
# `push` (to main) and on a manual `workflow_dispatch` (e.g. to re-seed baseline.json without
# waiting for a push). One consequence: the perf job and its baseline-comparison step are no
# longer exercised on a PR at all -- a break in either is only observable after a push/dispatch.
#
# `docs-only-close-guard` is the other exception: it is the one *merge* gate on the
# documentation-to-code link, so it must run on exactly the PRs the `changes` filter excludes --
# it does not depend on `changes` at all, and instead skips on non-`pull_request` events (it
# needs a PR body and file list). It only blocks a merge once it is added to branch protection's
# required checks; until then it reports red without blocking.

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger -- with `perf` now push-to-main-only, this keeps a way to sample a
  # fresh perf run (e.g. to re-seed baseline.json) without needing a push (issue #708).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Mirrors coverage.yml's path filter (see coverage.yml for the counterpart);
          # update both together.
          filters: |
            code:
              - "custom_components/**"
              - "tests/**"
              - "pyproject.toml"
              - "requirements-test.txt"
              - "hacs.json"
              - ".github/workflows/ci.yml"

  lint:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.15.22
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      # Exit 5 = "no tests collected"; tolerated during scaffolding before the
      # first tests land (Phase 1). Any real failure (exit 1) still fails the job.
      # test_coordinator_perf.py is excluded -- it has its own dedicated perf job below
      # with its own (advisory-only) tolerance; this required job must not also gate on
      # it (#708). Its sibling test_compare_baseline.py (plain-pytest, no HA dependency)
      # is deliberately NOT excluded -- it still needs a real, non-advisory gate.
      - run: pytest -q --ignore=tests/benchmarks/test_coordinator_perf.py || [ $? -eq 5 ]

  perf:
    # CPU/RSS tripwire for the M1 control cycle (issue #708, ADR-0026), separate from the
    # functional gate above. continue-on-error: advisory-only until real trend history
    # exists -- a ceiling breach, or a baseline comparison regression, is visible in the
    # run but never blocks merge. push-to-main only (issue #729): see the header comment.
    needs: changes
    if: always() && github.event_name != 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # github.workspace, not runner.temp -- the runner context isn't available in a
      # job-level env: block (only github/needs/strategy/matrix/vars/secrets/inputs are).
      PERF_RESULTS_DIR: ${{ github.workspace }}/perf-results
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - run: pytest tests/benchmarks -q
      - run: python tests/benchmarks/compare_baseline.py "$PERF_RESULTS_DIR/coordinator_cycle.json" tests/benchmarks/baseline.json >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: ${{ env.PERF_RESULTS_DIR }}
          if-no-files-found: ignore
      # README badge (issue #741) -- median CPU ms only; RSS/peak-memory stay in the step
      # summary table above. A snapshot of the last run on refs/heads/main -- a push, or a
      # manual workflow_dispatch run on main (e.g. to re-seed baseline.json); never a
      # feature branch or a PR. `always()` is deliberate: a run that breaches the CPU
      # ceiling should still show its real (regressed) value on the badge, not skip it.
      - name: Read median CPU time for the badge
        id: perf_badge
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -f "$PERF_RESULTS_DIR/coordinator_cycle.json" ]; then
            # median_cpu_ms's name is tests/benchmarks/compare_baseline.py's own METRICS --
            # a rename there needs a matching update here.
            ms=$(python -c "import json, os; p = os.environ['PERF_RESULTS_DIR'] + '/coordinator_cycle.json'; print(f'{json.load(open(p))[\"median_cpu_ms\"]:.2f}')")
            echo "median_cpu_ms=$ms" >> "$GITHUB_OUTPUT"
          fi
      - name: Update perf badge gist
        if: always() && github.ref == 'refs/heads/main' && steps.perf_badge.outputs.median_cpu_ms != ''
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c567fdec00982c4da95cfe92f80caf81
          filename: smart-charging-perf.json
          label: median cpu
          message: ${{ steps.perf_badge.outputs.median_cpu_ms }} ms
          color: blue

  docs-only-close-guard:
    # A documentation-only diff cannot implement code, so it must not be allowed to close a
    # code task. Refuses a PR whose changed files are all under `docs/` and whose body uses a
    # GitHub closing keyword on an issue labelled `development` or `testing`. (Post-mortem
    # 2026-09-11: PR #510 closed development issue #375 as COMPLETED while its own body said
    # the code fix was still outstanding -- the task was then never picked up again.)
    #
    # Deliberately NOT in ai-pipeline.yml: that file is a router fired by
    # `pull_request: types: [labeled]`, so a check placed there runs only when someone applies
    # a label and gates no merge at all. Deliberately not a `_ai-review.yml` checklist item
    # either: that is a model's judgement on a PR that reached `needs-review`, not a status
    # check. This is the project's one hard gate on this failure mode; the two prompt-level
    # checks backing it up are in `.claude/skills/write-requirement/SKILL.md` and
    # `.claude/agents/analysis-reviewer.md`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Refuse a docs-only PR that closes a development/testing issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "PR changes no files; guard does not apply."
            exit 0
          fi
          if echo "$files" | grep -qv '^docs/'; then
            echo "Diff touches paths outside docs/; guard does not apply."
            exit 0
          fi
          body=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""')
          # GitHub's own closing keywords, case-insensitive. Anything else -- notably
          # "Part of #N" -- is not a closing reference and is ignored here.
          closed=$(echo "$body" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
          if [ -z "$closed" ]; then
            echo "Docs-only diff, no closing reference. OK."
            exit 0
          fi
          offenders=""
          for n in $closed; do
            labels=$(gh api "repos/$REPO/issues/$n" --jq '.labels[].name' 2>/dev/null || true)
            for label in $labels; do
              case "$label" in
                development|testing) offenders="$offenders #$n ($label)" ;;
              esac
            done
          done
          if [ -n "$offenders" ]; then
            echo "::error::Documentation-only diff closes code task issue(s):$offenders. A docs change cannot complete a development/testing task -- reference them with 'Part of #N' and let the PR carrying the code close them."
            exit 1
          fi
          echo "Docs-only diff closes no development/testing issue. OK."

  hassfest:
    # Validates manifest.json / integration structure against Home Assistant's own checks.
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # Validates the repo is installable as a HACS custom integration.
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # brands requires the integration to be listed in home-assistant/brands,
          # which only happens at publish time. Ignore it during pre-publish dev.
          ignore: brands
