name: Upstream drift

# Weekly: does anything this project vendors still match the upstream state it is pinned to?
# The pins are .claude/profile.yml's `dependencies`, the provenance manifest; the comparison
# and every verdict it can reach are .github/check-upstream-drift.py's, and this workflow only
# carries the answer to a human. Why it exists, why it may never edit a skill or the manifest,
# and how a report is closed, are in the document `CLAUDE.md`'s **Contribution workflow** topic
# routes to for the CI lifecycle -- the single source for that argument; this header does not
# restate it.
#
# Three invariants this file must keep. Why each one holds is in the routed document; what
# they are is this file's own subject, and every step below is written to one of them:
#
#   1. It writes nothing to the repository -- no commit, no branch, no edit to a skill.
#   2. It applies `workflow` and no other label, `needs-*` least of all.
#   3. One open report at a time, updated in place and only when its content actually changed.

on:
  schedule:
    # Mondays, 06:17 UTC. The offset is deliberate: GitHub drops scheduled runs at the top of
    # popular hours under load, and a weekly check that silently skips is worse than none.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel in progress: a run that is part-way through creating the issue must finish.
  group: upstream-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole write surface: opening or editing one issue. Deliberately no `contents:
      # write` and no `pull-requests: write` -- property 1 above is enforced by the token,
      # not only by the steps.
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # PyYAML is the check's one dependency: the manifest is YAML, and the runner image does
      # not promise it.
      - run: python -m pip install pyyaml==6.0.3

      # The fixtures run first, for the same reason ci.yml runs each check's tests first: they
      # are the check's only correctness evidence, and a scheduled job nobody watches is
      # exactly where a broken check would rot unnoticed. They never touch the network.
      - name: Drift check self-test
        run: bash .github/test-check-upstream-drift.sh

      - name: Compare every pin with upstream
        id: check
        env:
          # Raises the api.github.com rate limit for the cross-repository reads; the token
          # grants nothing on those repositories beyond what is public.
          GITHUB_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/drift.md
        run: |
          # `set +e` first, and it is load-bearing: a `run:` step with no `shell:` is executed
          # as `bash -e {0}`, and `set -uo pipefail` does NOT clear errexit. Without this the
          # step would die on the check's exit 1 -- its documented "something needs a human"
          # code, and the only code a run with anything to report can return -- so `rc=$?`
          # would never run and the issue would never be opened.
          set +e
          set -uo pipefail
          bash .github/check-upstream-drift.sh --out "$REPORT"
          rc=$?
          case "$rc" in
            0) echo "report=false" >> "$GITHUB_OUTPUT"; echo "Every pin matches upstream." ;;
            # Exit 1 is also Python's uncaught-exception code, so the report's existence is
            # checked rather than inferred: a crash must not reach `gh issue create` with a
            # --body-file that was never written.
            1) if [ -s "$REPORT" ]; then
                 echo "report=true" >> "$GITHUB_OUTPUT"
               else
                 echo "::error::drift check exited 1 but wrote no report"
                 exit 1
               fi ;;
            # A lookup that did not answer is not a verdict: fail the run rather than open an
            # issue whose rows are silently incomplete.
            *) echo "::error::drift check failed (exit $rc)"; exit "$rc" ;;
          esac

      - name: Open or update the one drift issue
        if: steps.check.outputs.report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPORT: ${{ runner.temp }}/drift.md
          EXISTING: ${{ runner.temp }}/existing.md
          MERGED: ${{ runner.temp }}/merged.md
          TITLE: "workflow: vendored dependencies have drifted from their pins"
        run: |
          set -euo pipefail
          # Both markers come from the script, never from a second copy here: a copy that fell
          # out of step would match nothing and open a fresh issue every week, which is exactly
          # the pile property 3 forbids -- and no test would go red, since each copy would
          # still agree with itself.
          markers=$(bash .github/check-upstream-drift.sh --markers)
          marker_start=$(printf '%s\n' "$markers" | sed -n 1p)
          marker_end=$(printf '%s\n' "$markers" | sed -n 2p)

          # Matched on the body marker alone -- not on the title, and not on the label. Either
          # can be changed by a maintainer triaging the issue, and each change would otherwise
          # hide the open report and open a second one. The explicit high limit is the trap the
          # tracker recipes warn about: `gh issue list` pages silently, and a missed row reads
          # as "no issue exists" rather than erroring.
          number=$(gh issue list --repo "$REPO" --state open --limit 500 \
            --json number,body \
            --jq "[.[] | select(.body | contains(\"$marker_start\"))] | first | .number // empty")

          if [ -z "$number" ]; then
            url=$(gh issue create --repo "$REPO" --title "$TITLE" --body-file "$REPORT" \
              --label workflow)
            echo "Opened $url"
            exit 0
          fi

          gh issue view "$number" --repo "$REPO" --json body --jq .body > "$EXISTING"

          # Only the region between the markers is this workflow's; whatever a maintainer wrote
          # around it is carried across unchanged. Replacing the whole body instead would
          # destroy such a note -- and would then differ from the generated report on every
          # later run, producing the weekly comment property 3 exists to avoid.
          awk -v s="$marker_start" -v e="$marker_end" -v report="$REPORT" '
            index($0, s) { inside = 1; while ((getline line < report) > 0) print line; next }
            index($0, e) { inside = 0; next }
            !inside      { print }
          ' "$EXISTING" > "$MERGED"

          # Compared on content, not on bytes. Three differences are noise and each would on
          # its own make an unchanged week look like a change: CRs (GitHub normalises issue
          # bodies), a trailing blank line (`--jq .body` emits one the report does not have),
          # and the generated-on date, which moves every run and means nothing.
          norm() {
            sed -e 's/\r$//' -e '/^Generated by /d' "$1" | sed -e :a -e '/^$/{$d;N;ba' -e '}'
          }
          if [ "$(norm "$EXISTING")" = "$(norm "$MERGED")" ]; then
            echo "Issue #$number already reports exactly this; left untouched."
            exit 0
          fi

          gh issue edit "$number" --repo "$REPO" --body-file "$MERGED"
          gh issue comment "$number" --repo "$REPO" \
            --body "The drift report above has been updated: the set of dependencies that no longer match their pins changed since the last run."
          echo "Updated #$number"
