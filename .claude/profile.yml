# Project profile — every value the method's scripts and commands read about THIS project.
#
# The method (docs/reference/**, .claude/skills/**, .claude/agents/**, the work-type files) is
# written to travel between repositories; this file is the part that does not. A value spelled
# here is spelled nowhere else under docs/reference/** or .claude/**: those files name the key
# (for example `board.fields.size.id`) and whoever runs the command resolves it here. Project
# facts that carry a *why* — git identity, merge strategy, what a board column means — are
# prose, in docs/reference/profile.md; this file holds only what a script or a command needs
# verbatim.
#
# Who reads it is not listed here — a list of readers is the kind that rots the moment one is
# added, and it had. Find them by rule instead:
#
#   grep -rln 'profile\.yml' .github/ .claude/ docs/
#
# Every hit is a candidate: some name the file to say what it holds rather than to read it.
# Which parts of this file a given reader reads is that reader's to state, not this header's.

repo:
  owner: kristofdegrave
  name: homeassistant-smart-charging

board:
  # GitHub Projects (v2) board "EMS": its number under the owner, and its node id.
  number: 1
  name: EMS
  project_id: PVT_kwHOABQtm84Bd8mI
  # Node ids are stable in practice but not guaranteed. Re-derive with
  #   gh project field-list <board.number> --owner <repo.owner> --format json
  # if an edit is rejected, and update them here — nowhere else.
  fields:
    size:
      id: PVTSSF_lAHOABQtm84Bd8mIzhYaY9g
      type: single_select
      options:
        XS: "eff732af"
        S: "9592a5a3"
        M: "9728cbdc"
        L: "c53df028"
        XL: "7b141a16"
    estimate:
      id: PVTF_lAHOABQtm84Bd8mIzhYaY9k
      type: number # story points; a plain number field, any positive integer
    status:
      id: PVTSSF_lAHOABQtm84Bd8mIzhYaYzw
      type: single_select
      # Listed in the board's column order. What each column means, and which are unused, is
      # docs/reference/profile.md's **Project board**.
      options:
        Backlog: "f75ad846"
        Ready: "08afe404"
        In progress: "47fc9ee4"
        In review: "4cc61d42"
        Done: "98236657"

# The label set, exactly as .github/setup-labels.sh writes it. Each entry is name, colour
# (six hex digits, no `#`) and description. A description must stay under GitHub's
# 100-character cap and contain no tab or backslash: the script's read-back compares it
# through jq's @tsv, which escapes both, and a mismatch there can never be cleared by
# re-running. What each group means is docs/reference/method/contribution-workflow.md's
# **Issue conventions**; the places the context vocabulary is also baked into are
# docs/reference/method/ci-pipeline.md's **Label vocabulary sync**.
labels:
  pretriage:
    - name: idea
      color: f2a101
      description: "Not yet scoped — work it with the work-idea skill into context-labelled issues"
  action:
    - name: needs-draft
      color: 0e8a16
      description: "Issue: with one context label, trigger the CI drafter"
    - name: needs-review
      color: fbca04
      description: "PR: trigger the fresh AI review"
    - name: needs-work
      color: d93f0b
      description: "PR: trigger the AI fix pass to address review remarks"
    - name: needs-approval
      color: b60205
      description: "PR: no automated work pending — a maintainer may merge it as it stands"
    - name: needs-decision
      color: e4e669
      description: "PR: review left findings open, or the PR is on hold — a maintainer decides how to proceed"
  # One per enabled work type — `work_types.enabled` below is this list's names, kept as a
  # separate key because a label is a tracker fact and a work type a method fact. The method
  # check (.github/check-method.py) fails when the two sets differ.
  context:
    - name: uc
      color: 1d76db
      description: "Use-case analysis document"
    - name: requirement
      color: 0052cc
      description: "Requirement / constraint / glossary change"
    - name: adr
      color: 5319e7
      description: "Architecture Decision Record"
    - name: development
      color: c5def5
      description: "Implementation task (code + tests), one task of an epic's implementation spec"
    - name: testing
      color: bfd4f2
      description: "Test-authoring work, one task of an epic's implementation spec"
    - name: workflow
      color: e99695
      description: "Skill, agent, workflow or process-doc change (drafting directed by the maintainer)"
    - name: documentation
      color: ededed
      description: "Design-doc change (docs/design/**)"
  # Orthogonal to the context label, never a substitute. GitHub creates both by default with a
  # vaguer description; the script's --force rewrites it to the meaning Issue conventions gives
  # them. Colours are GitHub's own defaults, so re-running never recolours labels already on
  # open issues.
  kind:
    - name: bug
      color: d73a4a
      description: "Defect in shipped behaviour — verify the claim first; pair with a context label once known"
    - name: enhancement
      color: a2eeef
      description: "Improvement to already-shipped behaviour — pair with a context label once the artifact is known"

# The work types this project enables, from the method's catalogue. Each names a row of
# CLAUDE.md's Model selection table and a directory under docs/reference/work-types/ — the
# method check (.github/check-method.py) verifies both: one row per entry here, and the
# directory complete (review.md; implement.md and done.md unless the row says `none`).
#
# A dependency below with `installed: repo` must be present under .claude/skills/, and a
# skill present there that is NOT declared below is the method's own — scanned by the check
# as a method file. This list is therefore how a vendored skill is told apart from an authored
# one; a vendored skill is never edited to say which layer it is.
work_types:
  enabled:
    - adr
    - uc
    - requirement
    - documentation
    - development
    - testing
    - workflow

# The stacks this project is built on: one entry per distinct `stack:` value of
# `dependencies.stack` below, keyed by that value. Each names, under `tokens`, the words that
# mark a sentence as this stack's. The method check (.github/check-method.py, check 5) refuses
# any of them — and the name of any stack skill — in a method-layer file under
# docs/reference/work-types/, so such a sentence has to live in the stack's overlay,
# docs/reference/work-types/<label>/overlays/<stack>.md, which check 4 requires for every work
# type that has an overlay slot. Matched as whole words in any case, a multi-word token across a
# line wrap too. A hand-kept choice, like check 5's list of profile keys: a word the method uses
# everywhere in its own right (`entity`, `adapter`, `harness`, `boundary`) is deliberately not
# here, and a new stack-specific word is not refused until it is added.
stacks:
  home-assistant:
    tokens:
      - Home Assistant
      - HA
      - homeassistant
      - hass
      - custom_components
      - coordinator
      - config entry
      - config-entry
      - config flow
      - config-flow
      - entity_id
      - MockConfigEntry
      - pytest-homeassistant-custom-component
      - manifest.json
      - strings.json
  python:
    tokens:
      - Python
      - pytest
      - ruff
      - async
      - asyncio
      - StrEnum
      - vol.In

review:
  # Review passes an interactive session may run per PR before the loop stops and escalates;
  # counted from the most recent reset event, as docs/reference/method/contribution-workflow.md's
  # **Rounds and the cap** defines. That section routes here for the number rather than
  # stating it.
  interactive_cap: 2
  # The most review passes the rounds a session grants itself at the cap may take the count
  # to, counted as interactive_cap is. The same section defines the self-grant and routes here
  # for this number rather than stating it.
  interactive_ceiling: 5
  # Changed path → the work type whose review checklist judges it. This is the no-label row
  # of CLAUDE.md's Model selection table, and applies to every PR whatever its label. It is
  # the fourth enumeration of that set, and the SOURCE of the other three — that row,
  # ai-pipeline.yml's path filter and _ai-review.yml's diff enumeration, each spelling it in
  # its own grammar. The watched-path check (.github/check-path-map.py, run by ci.yml) holds all three
  # to this copy and names which one is missing which tree, so adding a tree still means
  # editing all four but no longer means remembering to. Only this copy says what a tree is
  # *for*, which is why it is the source and not merely the fourth. CLAUDE.md's row states the
  # obligation; the CI document its Contribution workflow topic routes to states why the three
  # are verified against this rather than generated from it.
  path_map:
    - work_type: adr
      paths: ["docs/adl/**"]
    - work_type: uc
      paths: ["docs/analysis/**"]
    - work_type: documentation
      paths: ["docs/design/**"]
    - work_type: development
      paths: ["custom_components/**"]
    - work_type: testing
      paths: ["tests/**"]
    - work_type: workflow
      paths:
        - ".github/workflows/**"
        - ".github/ISSUE_TEMPLATE/**"
        - ".github/setup-labels.sh"
        - ".github/profile-env.sh"
        # The two checked-in checks, their fixtures, the git hooks, the Claude Code
        # PreToolUse guard and the settings file that wires it: each is a gate or a rule's
        # mechanical half, so an edit to one is `workflow` work like the rule itself. The
        # settings file earns its entry twice over — an edit there decides whether the guard
        # runs at all, so leaving it out would review the guard and not its off switch.
        - ".github/check-*"
        - ".github/test-check-*"
        - ".github/hooks/**"
        - ".claude/hooks/**"
        - ".claude/settings.json"
        - ".claude/skills/**"
        - ".claude/agents/**"
        - ".claude/profile.yml"
        - "docs/reference/**"
        - "CLAUDE.md"

# A cap in words per class of process file; the first glob a path matches is its class. The
# rule these feed, and what `added_only` means, is the header of .github/check-word-budget.py.
word_budgets:
  - glob: "CLAUDE.md"
    cap: 2000
  - glob: ".claude/skills/*/SKILL.md"
    cap: 1500
  - glob: ".claude/agents/*.md"
    cap: 1000
  - glob: "docs/reference/method/*.md"
    cap: 4000
  - glob: "docs/reference/work-types/**/*.md"
    cap: 1500
  - glob: "docs/adl/*.md"
    cap: 2000
    added_only: true

# Everything the method or the stack is built on that lives outside this repository, each
# pinned to the upstream state it was last reconciled with. This is the provenance manifest,
# and adding a skill from any external source means adding its row in the same PR — an
# undeclared copy is read as authored, by the method check and by anyone reading the tree.
# .github/check-upstream-drift.py reads these rows weekly and reports every pin that no longer
# matches upstream — the CI document `CLAUDE.md`'s **Contribution workflow** topic routes to
# owns that check. A pin is bumped by a decision recorded in the PR that bumps it — never by an
# automatic re-sync, since several of these are adaptations rather than copies; the reference
# `CLAUDE.md`'s **Authoring AI artifacts** topic routes to owns that rule — and, with it, what
# a `sha256:` row's relationship to skills-lock.json obliges. That reference states it in full;
# this header does not restate it.
#
#   source     GitHub repository the skill came from
#   path       path of the skill inside that repository
#   pin        `commit:<sha>` — the last upstream commit touching `path` at reconciliation —
#              or `sha256:<hash>` where only the installer's content hash of SKILL.md was
#              recorded (skills-lock.json); the drift check reports such a row as unresolvable
#              until it is reconciled to a `commit:` pin, for the reason the CI document routed to
#              above gives.
#   installed  `repo` — a copy lives in .claude/skills/<name>/; `user` — installed once on
#              the developer's machine by the plugin named, and not part of this repository
dependencies:
  method:
    # Skills the method's own work files name per step, from the superpowers plugin.
    - name: brainstorming
      source: obra/superpowers
      path: skills/brainstorming
      pin: commit:b36e0829c6d0
      installed: user
    - name: writing-plans
      source: obra/superpowers
      path: skills/writing-plans
      pin: commit:b36e0829c6d0
      installed: user
    - name: test-driven-development
      source: obra/superpowers
      path: skills/test-driven-development
      pin: commit:b9e75dddec7a
      installed: user
    - name: systematic-debugging
      source: obra/superpowers
      path: skills/systematic-debugging
      pin: commit:c8921b515656
      installed: user
    - name: verification-before-completion
      source: obra/superpowers
      path: skills/verification-before-completion
      pin: commit:3be5aad3dd24
      installed: user
    - name: receiving-code-review
      source: obra/superpowers
      path: skills/receiving-code-review
      pin: commit:3fb75974186e
      installed: user
    # Skills ported — adapted, not copied — into this repository.
    - name: grilling
      source: mattpocock/skills
      path: skills/productivity/grilling
      pin: commit:85f83d3fde1d
      installed: repo
    - name: grill-me
      source: mattpocock/skills
      path: skills/productivity/grill-me
      pin: commit:fcf0071560d3
      installed: repo
    - name: handoff
      source: mattpocock/skills
      path: skills/productivity/handoff
      pin: commit:d28dfdc39bea
      installed: repo
    - name: research
      source: mattpocock/skills
      path: skills/engineering/research
      pin: commit:321658273cb1
      installed: repo
    - name: diagnosing-bugs
      source: mattpocock/skills
      path: skills/engineering/diagnosing-bugs
      pin: commit:321658273cb1
      installed: repo
    - name: resolving-merge-conflicts
      source: mattpocock/skills
      path: skills/engineering/resolving-merge-conflicts
      pin: commit:321658273cb1
      installed: repo
    # Upstream-intact marketplace install; used by the design documents, not by a stack.
    - name: domain-driven-design
      source: wondelai/skills
      path: domain-driven-design
      pin: sha256:59c101a9dc2e7b4cb1d20287bd2f0e9e5ef69315b7c25f477dd5cafb414f57cb
      installed: repo
  # Stack packages: the Home Assistant and Python skills. Declared here, not part of the
  # method; copied into .claude/skills/ and pinned per project.
  stack:
    - name: ha-integration-knowledge
      stack: home-assistant
      source: home-assistant/core
      path: .claude/skills/ha-integration-knowledge
      pin: sha256:205f21832aee357842f17afbfe0e57b51c8fa34b7b9ac62ebec4cd529b637158
      installed: repo
    - name: async-python-patterns
      stack: python
      source: wshobson/agents
      path: plugins/python-development/skills/async-python-patterns
      pin: sha256:15eb61c8d5c4870d57044cfb199d0aa028d8e1e73e9bb8cb6122da32c76efb77
      installed: repo
    - name: python-anti-patterns
      stack: python
      source: wshobson/agents
      path: plugins/python-development/skills/python-anti-patterns
      pin: sha256:6aad22ecbc1546927f2d2c6cac7ac793aa8256a6b47ded75d8c628c5fe491259
      installed: repo
