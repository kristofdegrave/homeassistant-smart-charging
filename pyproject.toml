[project]
name = "smart-charging"
version = "0.1.0"
description = "Smart Charging — Home Assistant EV charging integration (Power/Solar/SolarOnly)"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
# ADR-0046's complexity guard: coordinator.py/coordinator_cycle.py must not regrow past this.
max-complexity = 10

[tool.ruff.lint.pylint]
# ADR-0046's statement-count guard, same two files.
max-statements = 35

[tool.ruff.lint.per-file-ignores]
# ADR-0046 scopes the guard to coordinator.py/coordinator_cycle.py alone: C901/PLR0915 are
# selected repo-wide above, then ignored for every file except that pair by one negated glob,
# rather than selected repo-wide and exempted file-by-file for every other violator (verified:
# `ruff check --config` against a scratch pyproject shows this glob form -- explicit
# `{coordinator,coordinator_cycle}.py`, not the `coordinator{,_cycle}.py` shorthand, whose
# empty-alternative branch globset does not match -- reports on both governed files and stays
# silent on every other one).
"!custom_components/smart_charging/{coordinator,coordinator_cycle}.py" = ["C901", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
