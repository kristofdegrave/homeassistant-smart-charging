[project]
name = "smart-charging"
version = "0.1.0"
description = "Smart Charging — Home Assistant EV charging integration (Power/Solar/SolarOnly)"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
# ADR-0046's complexity guard: coordinator.py/coordinator_cycle.py must not regrow past this.
max-complexity = 10

[tool.ruff.lint.pylint]
# ADR-0046's statement-count guard, same two files.
max-statements = 35

[tool.ruff.lint.per-file-ignores]
# ADR-0046 scopes the guard to coordinator.py/coordinator_cycle.py alone; every function named
# below, pre-existing and outside that record's scope, is unchanged by it.
"custom_components/smart_charging/adapters/factory.py" = ["C901"]
"custom_components/smart_charging/entity.py" = ["C901"]
"custom_components/smart_charging/modes/solar.py" = ["C901"]
"custom_components/smart_charging/modes/solar_only.py" = ["C901"]
".github/check-method.py" = ["C901", "PLR0915"]
".github/check-upstream-drift.py" = ["C901", "PLR0915"]
"tests/test_deadline_soc_management_end_to_end.py" = ["PLR0915"]
"tests/test_init.py" = ["PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
